# /etc/rsyslog.d/10-router.conf
# Receives router syslog on UDP 514 and accepts only the router's address.
# Also restrict the port with ufw:
#   sudo ufw allow from 192.168.50.1 to any port 514 proto udp

module(load="imudp")
input(type="imudp" port="514" ruleset="router")
ruleset(name="router") {
  if $fromhost-ip == "192.168.50.1" then {
    action(type="omfile" file="/var/log/router/flint3.log")
  }
  stop
}
